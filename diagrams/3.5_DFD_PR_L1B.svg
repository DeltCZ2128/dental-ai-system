width="25" height="12" fill="#ffffff"/><text x="1150" y="362" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">G23</text><rect x="1273" y="248" width="25" height="12" fill="#ffffff"/><text x="1286" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">G24</text><text x="56" y="848" text-anchor="start" font-family="Arial" font-size="11" fill="#000000" font-weight="bold">DATA FLOW LEGEND</text><text x="56" y="868" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G1 = QR check-in details / walk-in request</text><text x="56" y="882" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G2 = Queue number and status</text><text x="56" y="895" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G3 = Queue review &amp; priority actions</text><text x="56" y="909" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G4 = Serving actions</text><text x="56" y="922" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G5 = Queue row write (assign / update status)</text><text x="56" y="936" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G6 = Queue lookup (next, waiting, serving)</text><text x="56" y="949" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G7 = Concern record write</text><text x="56" y="963" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G8 = Concern lookup</text><text x="56" y="976" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G9 = Concern-linked appointment</text><text x="56" y="990" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G10 = Appointment lookup (validate concern)</text><text x="56" y="1003" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G11 = Patient alerts (booking, status, queue)</text><text x="56" y="1017" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G12 = Dentist alerts (schedule, concerns)</text><text x="568" y="868" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G13 = Admin alerts (new concern, status changes)</text><text x="568" y="882" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G14 = Patient notification write</text><text x="568" y="895" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G15 = Admin notification write</text><text x="568" y="909" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G16 = Appointment snapshot for message text</text><text x="568" y="922" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G17 = Queue / concern event (raises an alert)</text><text x="568" y="936" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G18 = Historical daily appointment counts (cancelled / no-show excluded)</text><text x="568" y="949" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G19 = Queue counts for report</text><text x="568" y="963" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G20 = Concern counts for report</text><text x="568" y="976" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G21 = Notification log for report</text><text x="568" y="990" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G22 = Treatment rows for report</text><text x="568" y="1003" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G23 = KPI cards, charts, PDF / CSV export view</text><text x="568" y="1017" text-anchor="start" font-family="Arial" font-size="10" fill="#000000">G24 = 7-day demand forecast (Low / Medium / High)</text><text x="56" y="1039" text-anchor="start" font-family="Arial" font-size="9" fill="#404040" font-style="italic">Rounded box = process or external entity; open-ended box = data store (Dn).</text><text x="56" y="1052" text-anchor="start" font-family="Arial" font-size="9" fill="#404040" font-style="italic">Wires carry the data-flow code; the legend gives the full flow name.</text><text x="56" y="1065" text-anchor="start" font-family="Arial" font-size="9" fill="#404040" font-style="italic">Where several sources feed one destination, the same code is repeated on each wire.</text><text x="827" y="1130" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-style="italic">Figure 7: Level 1 Data Flow Diagram of the Proposed System (Part 2 of 2)</text></svg>